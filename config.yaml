data_root: ../EEG_data
output_root: outputs

expected_subjects:
  - "25009"
  - "25010"
  - "25011"
  - "25012"
  - "25013"
  - "25014"
  - "25015"
  - "25016"
  - "25017"
  - "25018"
  - "25019"
  - "25020"
  - "25021"
  - "25022"
  - "25023"

driving_conditions:
  normal_driving: normal
  fast_driving: fast

resting_conditions:
  - resting_before_normal_driving
  - resting_after_normal_driving
  - resting_before_fast_driving
  - resting_after_fast_driving

crop:
  events_per_lap: 9
  laps_per_session: 6
  accept_truncated_laps:
    - subject_id: "25019"
      condition: fast_driving
      lap_index: 4
      reason: "The available lap data are retained as usable after the final marker was slightly truncated."

preprocess:
  target_sfreq: 250.0
  l_freq: 1.0
  h_freq: 40.0
  reference_channels: [A1, A2]
  acquisition_ground: AFz
  acquisition_reference: FCz
  offline_reference_mode: average_of_A1_A2
  montage: standard_1020
  bad_channel_z: 6.0
  flat_std_uV: 0.1
  baseline_mode: none
  ica:
    enabled: true
    method: infomax
    n_components: 0.99
    min_components: 2
    random_state: 97
    max_iter: 2000
    eye_channels: [Fp1, Fp2]
    eye_corr_threshold: 0.35
    muscle_band: [30.0, 40.0]
    total_band: [1.0, 40.0]
    muscle_ratio_threshold: 0.45
    kurtosis_threshold: 8.0
    max_auto_exclude: 2

features:
  windows_per_lap: 6
  exclude_channels: [A1, A2]
  bands:
    delta: [1.0, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    low_gamma: [30.0, 40.0]
